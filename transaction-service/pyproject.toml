[project]
name = "transaction-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "beanie",
    "motor",
    "httpx", # For async requests to other services (e.g., risk-service)
]

[project.optional-dependencies]
dev = [
    "pytest",
]